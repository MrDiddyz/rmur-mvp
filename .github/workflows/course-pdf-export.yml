name: Course PDF Export

on:
  workflow_dispatch:
  push:
    paths:
      - 'course-chatgpt-for-grundere/modules/**/slides/*.md'

permissions:
  contents: read

jobs:
  export-pdf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Pandoc
        run: sudo apt-get update && sudo apt-get install -y pandoc
      - name: Generate PDFs
        run: |
          chmod +x course-chatgpt-for-grundere/automation/generate-pdf.sh
          course-chatgpt-for-grundere/automation/generate-pdf.sh
      - name: Upload PDF artifacts
        uses: actions/upload-artifact@v4
        with:
          name: course-slide-pdfs
          path: course-chatgpt-for-grundere/modules/**/slides/*.pdf
